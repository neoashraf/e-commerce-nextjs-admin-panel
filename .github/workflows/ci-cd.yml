name: CI/CD — Admin Panel

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.15.0"
  CONTAINER_NAME: sports-ecommerce-admin-panel

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Resolve build-time env vars
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}" >> $GITHUB_OUTPUT
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.PROD_SITE_URL }}" >> $GITHUB_OUTPUT
          else
            echo "NEXT_PUBLIC_API_URL=${{ secrets.DEV_API_URL }}" >> $GITHUB_OUTPUT
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.DEV_SITE_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.vars.outputs.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.vars.outputs.NEXT_PUBLIC_SITE_URL }}
        run: pnpm build

  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: verify

    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.image.outputs.IMAGE_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE" >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE" >> $GITHUB_OUTPUT

      - name: Resolve build-time env vars
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}" >> $GITHUB_OUTPUT
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.PROD_SITE_URL }}" >> $GITHUB_OUTPUT
          else
            echo "NEXT_PUBLIC_API_URL=${{ secrets.DEV_API_URL }}" >> $GITHUB_OUTPUT
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.DEV_SITE_URL }}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.ref_name }}-latest

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.vars.outputs.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ steps.vars.outputs.NEXT_PUBLIC_SITE_URL }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker

    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set deployment variables
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "VPS_HOST=${{ secrets.VPS_HOST }}"           >> $GITHUB_ENV
            echo "VPS_USER=${{ secrets.VPS_USER }}"           >> $GITHUB_ENV
            echo "VPS_SSH_KEY<<EOF"                            >> $GITHUB_ENV
            printf '%s\n' "${{ secrets.VPS_SSH_KEY }}"        >> $GITHUB_ENV
            echo "EOF"                                         >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}"   >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.PROD_SITE_URL }}" >> $GITHUB_ENV
            echo "IMAGE_TAG=${{ env.IMAGE_NAME }}:main-latest" >> $GITHUB_ENV
            echo "ENVIRONMENT=production"                      >> $GITHUB_ENV
          else
            echo "VPS_HOST=${{ secrets.DEV_VPS_HOST }}"       >> $GITHUB_ENV
            echo "VPS_USER=${{ secrets.DEV_VPS_USER }}"       >> $GITHUB_ENV
            echo "VPS_SSH_KEY<<EOF"                            >> $GITHUB_ENV
            printf '%s\n' "${{ secrets.DEV_VPS_SSH_KEY }}"    >> $GITHUB_ENV
            echo "EOF"                                         >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_URL=${{ secrets.DEV_API_URL }}"    >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.DEV_SITE_URL }}"  >> $GITHUB_ENV
            echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY,,}:dev-latest" >> $GITHUB_ENV
            echo "ENVIRONMENT=development"                     >> $GITHUB_ENV
          fi

      - name: Validate secrets
        run: |
          [ -z "$VPS_HOST" ]    && echo "VPS_HOST missing"    && exit 1
          [ -z "$VPS_USER" ]    && echo "VPS_USER missing"    && exit 1
          [ -z "$VPS_SSH_KEY" ] && echo "VPS_SSH_KEY missing" && exit 1
          [ -z "$NEXT_PUBLIC_API_URL" ]  && echo "API_URL missing"  && exit 1
          [ -z "$NEXT_PUBLIC_SITE_URL" ] && echo "SITE_URL missing" && exit 1
          echo "All secrets present — deploying to $ENVIRONMENT"

      - name: Deploy to ${{ env.ENVIRONMENT }} server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            GHCR_USER="${{ github.actor }}" \
            IMAGE_TAG="$IMAGE_TAG" \
            CONTAINER="$CONTAINER_NAME" \
            API_URL="$NEXT_PUBLIC_API_URL" \
            SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            bash -s << 'ENDSSH'
              set -e

              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

              docker pull "$IMAGE_TAG"

              docker rm -f "$CONTAINER" || true

              docker run -d \
                --name "$CONTAINER" \
                -p 6002:3002 \
                -e NEXT_PUBLIC_API_URL="$API_URL" \
                -e NEXT_PUBLIC_SITE_URL="$SITE_URL" \
                --restart unless-stopped \
                "$IMAGE_TAG"

              sleep 10
              docker ps --filter "name=$CONTAINER" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

              echo "--- Recent logs ---"
              docker logs --tail=50 "$CONTAINER"

              docker image prune -f
              echo "✅ Deployment to $ENVIRONMENT completed"
ENDSSH
