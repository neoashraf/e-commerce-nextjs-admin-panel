# Local orchestration for the admin panel.
# The backend is expected to run separately (or be reachable at NEXT_PUBLIC_API_URL).
#
#   docker compose up --build
#
# Host port is fixed at 6002 across both servers (backend uses 6001, storefront 6003).
# NEXT_PUBLIC_* are baked at build time, so changing them requires a rebuild.
services:
  admin:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:6001/api/v1}
    image: sports-ecom/admin:local
    container_name: sports-ecommerce-admin
    ports:
      - "6002:3002"
    restart: unless-stopped
